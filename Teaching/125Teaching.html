<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Andrew's Notes</title>
  <link rel="stylesheet" href="../styles.css">

  <style>
    :root {
      --pair-gap: 30px;     /* space between the two side-by-side iframes */
      --figure-gap: 60px;   /* space between the first figure and the pair figure */
    }

    figure.demo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
      padding: 15px;
      border: 2px solid #000000;
      border-radius: 8px;
      max-width: fit-content;
    }

    figure.demo + figure.demo {
      margin-top: var(--figure-gap);
    }

    figure.demo iframe {
      border: 1px solid #e4e4e4;
      border-radius: 4px;
    }

    .iframe-row {
      display: flex;
      gap: var(--pair-gap);
      justify-content: center;
      flex-wrap: wrap;      /* stacks the two iframes on narrow screens */
    }

    figure.demo figcaption {
      text-align: center;
      margin-top: 10px;
      font-style: italic;
      color: #555;
    }
  </style>
</head>

<body style="margin: 100px; background-color: #CBD4CB;">

  <figure class="demo">

    <figcaption>Solids of Revolution Using Cylindrical Shells</figcaption>
  </figure>

  <figure class="demo">
    <div class="iframe-row">
      <iframe src="https://www.geogebra.org/3d/rhjrjkms?embed" width="550" height="415" allowfullscreen frameborder="0"></iframe>
      <iframe src="https://www.geogebra.org/3d/cpmrevvn?embed" width="550" height="415" allowfullscreen frameborder="0"></iframe>
    </div>
    <figcaption>Volumes of Solids by Cross Sections</figcaption>
  </figure>

</body>
